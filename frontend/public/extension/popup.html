<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scheme Seva Kendra Assistant</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1a30;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 28px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #f59e0b;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .profile-name {
      font-size: 15px;
      font-weight: 800;
      color: white;
    }
    .profile-meta {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      padding: 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #0f172a;
      border-color: #38bdf8;
    }
    .badge-empty {
      background: #7f1d1d;
      color: #fca5a5;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }
    .badge-synced {
      background: #064e3b;
      color: #6ee7b7;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🏛️</div>
    <div>
      <div class="title">Scheme Seva Kendra</div>
      <div class="subtitle">e-RPA Form Auto-Fill Assistant</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Active Citizen Profile</div>
    <div class="profile-name" id="prof-name">Citizen Profile</div>
    <div class="profile-meta" id="prof-details">Checking shared storage...</div>
    <div id="prof-badge-container"></div>
  </div>

  <button class="btn" id="btn-trigger">
    <span>⚡</span> Auto-Fill Open Scheme Portal
  </button>

  <button class="btn-secondary" id="btn-load-demo">
    <span>📋</span> Load Complete Demo Citizen Profile
  </button>

  <button class="btn-secondary" id="btn-refresh-sync">
    <span>🔄</span> Refresh Sync from Open Tab
  </button>

  <div id="status-msg" style="font-size: 11px; text-align: center; margin-top: 6px; color: #10b981; min-height: 16px;"></div>

  <div style="font-size: 10px; color: #94a3b8; text-align: center; margin-top: 6px;">
    Emergency Stop: <kbd style="background: #334155; padding: 2px 4px; border-radius: 4px; color: #f87171; font-weight: 700;">Shift+Esc</kbd> / <kbd style="background: #334155; padding: 2px 4px; border-radius: 4px; color: #f87171; font-weight: 700;">Alt+X</kbd>
  </div>

  <div class="footer">
    SIH PS 26092 • Render 512MB RAM Guarded • FastEmbed ONNX
  </div>

  <script src="popup.js"></script>
</body>
</html>
